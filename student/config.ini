; Settings for fes_prep.py.  Lines starting with ; are comments.

[forcefield]
; Protein force field and water model used by tleap.
;   ff19SB + opc   : recommended (Amber's recommendation for ff19SB; the 4Fe4S_*_3Cys sets were derived with it)
;   ff14SB + tip3p : the combination most literature sets were published with (see FORCE_FIELDS.md)
protein = ff19SB
water   = opc

[solvation]
; Minimum distance (Angstrom) between the protein and the edge of the rectangular water box.
; The system is neutralised with Na+/Cl-.
buffer = 10.0

[cleanup]
; Monatomic ions that are kept from the PDB (residue names as in the PDB). Everything else that is not
; protein, water or an Fe-S cluster is removed and listed as a warning in prep_report.json.
keep_ions = NA K CL MG CA ZN MN
; Remove unknown ligands/cofactors (yes) or stop with an error (no).
drop_unknown_hetero = yes
; Name given to histidines that are not cluster ligands (HIE = proton on NE2, HID = on ND1, HIP = both).
histidine = HIE

[options]
; A cluster Fe that also binds a non-Cys/His protein atom (e.g. Glu, Asp, Ser) has no parameter set.
; yes = for ALL structures, use the set for the remaining ligands and keep the extra ligand non-bonded (warning is written).
; To do this for selected structures only, use the extra_ligands column of overrides.csv (e.g. 2y0f,*,*,,unbound).
treat_extra_ligands_as_unbound = no

[programs]
tleap = tleap

[parameter_sets]
; Which parameter set to use for each cluster environment (folder names in parameters/).
; The environment is detected from the structure: <cluster>_<protein ligands>.
; The oxidation state cannot be read from a structure: choose it here, or per cluster in overrides.csv.
;
; [4Fe-4S], 4 Cys.  Alternatives: 4Fe4S_twoplus_4Cys_CarvalhoSwart2014, 4Fe4S_oneplus_4Cys_CarvalhoSwart2014 (1+),
;                    4Fe4S_threeplus_4Cys_Teo2020 (3+, HiPIP)
4Fe4S_4Cys      = 4Fe4S_twoplus_4Cys_Teo2020
; [4Fe-4S], 3 Cys and one Fe without protein ligand.  Alternative: 4Fe4S_oneplus_3Cys (1+, see known issue)
4Fe4S_3Cys      = 4Fe4S_twoplus_3Cys
; [2Fe-2S], 4 Cys (ferredoxin type).  Alternatives: 2Fe2S_oneplus_4Cys_Nakayoshi2022 (1+), 2Fe2S_twoplus_4Cys_Carvalho2013
2Fe2S_4Cys      = 2Fe2S_twoplus_4Cys_Nakayoshi2022
; [2Fe-2S], 2 Cys + 2 His (Rieske).  Alternative: 2Fe2S_oneplus_2Cys2His_Dawson2016 (1+)
2Fe2S_2Cys2His  = 2Fe2S_twoplus_2Cys2His_Dawson2016
; [2Fe-2S], 3 Cys + 1 His (mitoNEET type).  Only the reduced (1+) set exists.
2Fe2S_3Cys1His  = 2Fe2S_oneplus_3Cys1His_Zuo2021
; Mononuclear Fe, 4 Cys (rubredoxin).  Only Fe(III).
1Fe_4Cys        = 1Fe_threeplus_4Cys_Carvalho2013
